name: CI

"on":
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt pre-commit yamllint jq bats golang-go
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          rustup component add rustfmt clippy
      - name: Syntax check
        run: bash -n install-agentic-tools.sh scripts/*.sh cloud/*.sh
      - name: ShellCheck
        run: shellcheck install-agentic-tools.sh scripts/*.sh cloud/*.sh
      - name: shfmt
        run: shfmt -i 2 -ci -d install-agentic-tools.sh scripts/*.sh cloud/*.sh
      - name: actionlint
        run: /home/runner/go/bin/actionlint
      - name: yamllint
        run: yamllint .
      - name: pre-commit
        run: pre-commit run --all-files

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install unit test tools
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Bats
        run: bats tests/unit

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --all-features
      - name: Lockfile validation
        run: cargo run -- verify-lockfile

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$USER" /nix
          curl -fsSL https://nixos.org/nix/install | sh -s -- --no-daemon
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          nix --version
      - name: Build package
        run: nix build
      - name: Run validation app
        run: nix run .#check
      - name: Run Nix e2e smoke
        run: nix run .#e2e
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Realize named dev shells
        run: |
          nix develop .#minimal --command true
          nix develop .#coding-agent --command true

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Docker static smoke
        run: docker build -f tests/Dockerfile.ubuntu-${{ matrix.ubuntu }} .

  quality-gate:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - static
      - unit
      - rust
      - nix
      - docker-smoke
    steps:
      - name: Require all CI jobs
        run: |
          failed=0
          for result in \
            "${{ needs.static.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.rust.result }}" \
            "${{ needs.nix.result }}" \
            "${{ needs.docker-smoke.result }}"; do
            if [[ "$result" != "success" ]]; then
              failed=1
              printf 'CI dependency finished with result=%s\n' "$result" >&2
            fi
          done
          exit "$failed"
